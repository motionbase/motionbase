<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Easing Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    // Set before first paint: embedded, the host block supplies the card frame.
    if (window.parent !== window) {
      document.documentElement.classList.add('is-embedded');
    }
  </script>
  <style>
    :root {
      /* MotionBase Design Tokens */
      --brand: #ff0055;
      --brand-soft: rgba(255, 0, 85, 0.14);

      --ink: #18181b;        /* zinc-900 */
      --ink-soft: #3f3f46;   /* zinc-700 */
      --muted: #71717a;      /* zinc-500 */

      --line: #e4e4e7;       /* zinc-200 */
      --line-soft: #f4f4f5;  /* zinc-100 */

      --surface: #ffffff;
      --surface-muted: #fafafa; /* zinc-50 */

      --radius-lg: 1rem;
      --radius-md: 0.75rem;

      --font: 'Inter', 'Inter var', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      font-family: var(--font);
      font-feature-settings: 'ss01', 'ss02', 'cv01', 'cv02';
      -webkit-font-smoothing: antialiased;
      background: var(--surface-muted);
      color: var(--ink);
    }

    body {
      padding: 1.5rem 1rem;
      display: flex;
      justify-content: center;
    }

    ::selection {
      background: var(--brand);
      color: #ffffff;
    }

    /* Card */
    .app-card {
      width: min(1100px, 100%);
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: clamp(1.25rem, 3vw, 2rem);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /*
     * Embedded in a course, the surrounding block already draws the card, so
     * drop our own frame and padding - otherwise it reads as a card in a card.
     * Overflow is hidden because the host sets our height from reportHeight(),
     * which would otherwise show a scrollbar until the first message lands.
     */
    .is-embedded,
    .is-embedded body {
      overflow: hidden;
    }

    .is-embedded body {
      padding: 0;
      background: transparent;
    }

    .is-embedded .app-card {
      width: 100%;
      border: 0;
      border-radius: 0;
    }

    /* Header */
    .header {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(1.375rem, 1.15rem + 0.7vw, 1.75rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .header p {
      margin: 0;
      font-size: 0.9375rem;
      line-height: 1.6;
      color: var(--muted);
      max-width: 62ch;
    }

    /* Main Grid Layout: Left Animation, Right Bezier Editor */
    .simulation-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      align-items: stretch;
    }

    @media (max-width: 860px) {
      .simulation-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Panels */
    .panel {
      background: var(--surface-muted);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Left Column: Stage & Ball Motion */
    .stage-card {
      justify-content: space-between;
      min-height: 340px;
    }

    .stage {
      position: relative;
      height: 160px;
      display: flex;
      align-items: center;
      margin: auto 0;
    }

    .track {
      position: absolute;
      left: 40px;
      right: 40px;
      top: 50%;
      height: 4px;
      transform: translateY(-50%);
      background: var(--line);
      border-radius: 999px;
    }

    .circle {
      position: absolute;
      top: 50%;
      left: 40px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      transform: translate3d(0, -50%, 0);
      background: var(--brand);
      box-shadow: 0 8px 20px rgba(255, 0, 85, 0.25);
      will-change: transform;
    }

    /* Right Column: Bezier Curve Editor */
    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      max-height: 280px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      touch-action: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: var(--radius-md);
      cursor: crosshair;
    }

    /* Presets */
    .presets-container {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }

    .presets-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }

    @media (max-width: 500px) {
      .presets-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .preset-btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-soft);
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      text-align: center;
    }

    .preset-btn:hover {
      background: var(--line-soft);
      border-color: #d4d4d8; /* zinc-300 */
    }

    .preset-btn:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    .preset-btn.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #ffffff;
    }

    /* Footer hint */
    .hint {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 1rem;
      border-top: 1px solid var(--line-soft);
      padding-top: 1rem;
      font-size: 0.8125rem;
      color: var(--muted);
    }

    .hint-item {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .dot {
      width: 0.625rem;
      height: 0.625rem;
      border-radius: 50%;
      flex: none;
    }

    .dot-ink { background: var(--ink); }
    .dot-brand { background: var(--brand); }
  </style>
</head>
<body>

  <main class="app-card">
    <header class="header">
      <h1>Easing Simulator</h1>
      <p>
        Ziehe die beiden Kontrollpunkte im Graph-Editor oder wähle ein Preset – die
        Vorschau links übernimmt die Interpolation sofort.
      </p>
    </header>

    <div class="simulation-grid">
      <!-- Left Column: Motion Preview -->
      <section class="panel stage-card" aria-label="Animations-Vorschau">
        <div class="panel-title">Vorschau</div>

        <div class="stage">
          <div class="track"></div>
          <div id="circle" class="circle"></div>
        </div>
      </section>

      <!-- Right Column: Interactive Bezier Curve Editor -->
      <section class="panel" aria-label="Bezier-Kurven-Editor">
        <div class="panel-title">Graph Editor</div>

        <div class="canvas-container" id="canvasContainer">
          <canvas id="bezierCanvas"></canvas>
        </div>

        <div class="presets-container">
          <div class="panel-title">Interpolations-Presets</div>
          <div class="presets-grid">
            <button class="preset-btn" data-preset="linear">Linear</button>
            <button class="preset-btn" data-preset="easeIn">Ease-In</button>
            <button class="preset-btn" data-preset="easeOut">Ease-Out</button>
            <button class="preset-btn active" data-preset="easeInOut">Ease-In-Out</button>
            <button class="preset-btn" data-preset="overshoot">Overshoot</button>
            <button class="preset-btn" data-preset="snapIn">Snap-In</button>
          </div>
        </div>
      </section>
    </div>

    <div class="hint">
      <span class="hint-item"><span class="dot dot-ink"></span> Kontrollpunkt 1</span>
      <span class="hint-item"><span class="dot dot-brand"></span> Kontrollpunkt 2</span>
      <span class="hint-item">Doppelklick auf einen Punkt setzt ihn linear zurück</span>
    </div>
  </main>

  <script>
    (() => {
      // DOM Elements
      const circle = document.getElementById("circle");
      const canvas = document.getElementById("bezierCanvas");
      const ctx = canvas.getContext("2d");
      const container = document.getElementById("canvasContainer");
      const presetBtns = document.querySelectorAll("[data-preset]");

      // MotionBase palette (mirrors the CSS tokens above)
      const COLOR = {
        brand: "#ff0055",
        brandLine: "rgba(255, 0, 85, 0.35)",
        ink: "#18181b",
        line: "#e4e4e7",
        lineStrong: "#d4d4d8",
        anchor: "#a1a1aa",
      };

      // Bezier Control Points (Normalized 0..1 for P1 and P2)
      let p1 = { x: 0.42, y: 0.0 };
      let p2 = { x: 0.58, y: 1.0 };

      // Blinking state for handles
      let hasInteracted = false;

      // Presets Definition
      const presets = {
        linear:    { p1: { x: 0.00, y: 0.00 }, p2: { x: 1.00, y: 1.00 } },
        easeIn:    { p1: { x: 0.42, y: 0.00 }, p2: { x: 1.00, y: 1.00 } },
        easeOut:   { p1: { x: 0.00, y: 0.00 }, p2: { x: 0.58, y: 1.00 } },
        easeInOut: { p1: { x: 0.42, y: 0.00 }, p2: { x: 0.58, y: 1.00 } },
        overshoot: { p1: { x: 0.34, y: 1.56 }, p2: { x: 0.64, y: 1.00 } },
        snapIn:    { p1: { x: 0.05, y: 0.90 }, p2: { x: 0.10, y: 1.00 } }
      };

      // Drag State
      let draggingPoint = null; // 'p1' or 'p2'

      // Canvas Padding
      const padX = 35;
      const padY = 55;

      function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const rect = container.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        drawCanvas();
      }

      window.addEventListener("resize", resizeCanvas);

      // Coordinate Mapping: Normalized (0..1) -> Canvas Pixels
      function toCanvasCoords(normX, normY) {
        const rect = container.getBoundingClientRect();
        const w = rect.width - 2 * padX;
        const h = rect.height - 2 * padY;

        const x = padX + normX * w;
        const y = (rect.height - padY) - normY * h;
        return { x, y };
      }

      // Coordinate Mapping: Canvas Pixels -> Normalized (0..1)
      function toNormalizedCoords(px, py) {
        const rect = container.getBoundingClientRect();
        const w = rect.width - 2 * padX;
        const h = rect.height - 2 * padY;

        let normX = (px - padX) / w;
        let normY = ((rect.height - padY) - py) / h;

        normX = Math.max(0, Math.min(1, normX));
        return { x: normX, y: normY };
      }

      // Draw Bezier Canvas Editor
      function drawCanvas() {
        const rect = container.getBoundingClientRect();
        const w = rect.width;
        const h = rect.height;

        ctx.clearRect(0, 0, w, h);

        const p0Px = toCanvasCoords(0, 0);
        const p3Px = toCanvasCoords(1, 1);
        const p1Px = toCanvasCoords(p1.x, p1.y);
        const p2Px = toCanvasCoords(p2.x, p2.y);

        // Grid Lines
        ctx.strokeStyle = COLOR.line;
        ctx.lineWidth = 1;

        // Base Box
        ctx.strokeRect(p0Px.x, p3Px.y, p3Px.x - p0Px.x, p0Px.y - p3Px.y);

        // Diagonal Linear Reference
        ctx.strokeStyle = COLOR.lineStrong;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(p0Px.x, p0Px.y);
        ctx.lineTo(p3Px.x, p3Px.y);
        ctx.stroke();
        ctx.setLineDash([]);

        // Handle Lines
        ctx.strokeStyle = COLOR.brandLine;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p0Px.x, p0Px.y);
        ctx.lineTo(p1Px.x, p1Px.y);
        ctx.moveTo(p3Px.x, p3Px.y);
        ctx.lineTo(p2Px.x, p2Px.y);
        ctx.stroke();

        // Cubic Bezier Curve
        ctx.strokeStyle = COLOR.brand;
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(p0Px.x, p0Px.y);
        ctx.bezierCurveTo(p1Px.x, p1Px.y, p2Px.x, p2Px.y, p3Px.x, p3Px.y);
        ctx.stroke();

        // Calculate blinking scale/opacity if not interacted yet
        let handleScale = 1;
        if (!hasInteracted) {
          const now = performance.now();
          // Smooth sine wave pulsation for blinking effect
          handleScale = 1 + 0.35 * Math.sin(now / 180);
        }

        // Control Point P1 (Ink)
        drawHandle(p1Px.x, p1Px.y, COLOR.ink, handleScale);

        // Control Point P2 (Brand)
        drawHandle(p2Px.x, p2Px.y, COLOR.brand, handleScale);

        // End points P0 & P3
        drawAnchor(p0Px.x, p0Px.y);
        drawAnchor(p3Px.x, p3Px.y);
      }

      function drawHandle(x, y, color, scale = 1) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y, 8 * scale, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.lineWidth = 2.5 * scale;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();
        ctx.restore();
      }

      function drawAnchor(x, y) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = COLOR.anchor;
        ctx.fill();
        ctx.restore();
      }

      // Pointer Interactivity (Mouse / Touch)
      function getPointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      }

      function onPointerDown(e) {
        const pos = getPointerPos(e);
        const p1Px = toCanvasCoords(p1.x, p1.y);
        const p2Px = toCanvasCoords(p2.x, p2.y);

        const distP1 = Math.hypot(pos.x - p1Px.x, pos.y - p1Px.y);
        const distP2 = Math.hypot(pos.x - p2Px.x, pos.y - p2Px.y);

        if (distP1 < 22) {
          draggingPoint = 'p1';
          hasInteracted = true;
        } else if (distP2 < 22) {
          draggingPoint = 'p2';
          hasInteracted = true;
        }

        if (draggingPoint) {
          presetBtns.forEach(btn => btn.classList.remove('active'));
        }
      }

      function onPointerMove(e) {
        if (!draggingPoint) return;
        e.preventDefault();

        const pos = getPointerPos(e);
        const norm = toNormalizedCoords(pos.x, pos.y);

        if (draggingPoint === 'p1') {
          p1 = norm;
        } else if (draggingPoint === 'p2') {
          p2 = norm;
        }

        drawCanvas();
      }

      function onPointerUp() {
        draggingPoint = null;
      }

      // Handle Double Click to Reset Tangent to Linear
      canvas.addEventListener("dblclick", (e) => {
        const pos = getPointerPos(e);
        const p1Px = toCanvasCoords(p1.x, p1.y);
        const p2Px = toCanvasCoords(p2.x, p2.y);

        const distP1 = Math.hypot(pos.x - p1Px.x, pos.y - p1Px.y);
        const distP2 = Math.hypot(pos.x - p2Px.x, pos.y - p2Px.y);

        let reset = false;

        if (distP1 < 22) {
          // Reset P1 tangent linearly (along line from 0,0 to 1,1)
          p1 = { x: 0.333, y: 0.333 };
          reset = true;
        } else if (distP2 < 22) {
          // Reset P2 tangent linearly (along line from 0,0 to 1,1)
          p2 = { x: 0.667, y: 0.667 };
          reset = true;
        }

        if (reset) {
          hasInteracted = true;
          presetBtns.forEach(btn => btn.classList.remove('active'));
          // Check if both are linear, activate Linear button if so
          if (Math.abs(p1.x - 0.333) < 0.05 && Math.abs(p1.y - 0.333) < 0.05 &&
              Math.abs(p2.x - 0.667) < 0.05 && Math.abs(p2.y - 0.667) < 0.05) {
            p1 = { x: 0.0, y: 0.0 };
            p2 = { x: 1.0, y: 1.0 };
            document.querySelector('[data-preset="linear"]')?.classList.add('active');
          }
          drawCanvas();
        }
      });

      canvas.addEventListener("mousedown", onPointerDown);
      window.addEventListener("mousemove", onPointerMove);
      window.addEventListener("mouseup", onPointerUp);

      canvas.addEventListener("touchstart", onPointerDown, { passive: false });
      window.addEventListener("touchmove", onPointerMove, { passive: false });
      window.addEventListener("touchend", onPointerUp);

      // Preset Buttons Handling
      presetBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          const key = btn.dataset.preset;
          if (presets[key]) {
            p1 = { ...presets[key].p1 };
            p2 = { ...presets[key].p2 };

            presetBtns.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");

            drawCanvas();
          }
        });
      });

      // --- Cubic Bezier Evaluation Engine ---
      function sampleCurveX(t) {
        return 3 * Math.pow(1 - t, 2) * t * p1.x + 3 * (1 - t) * Math.pow(t, 2) * p2.x + Math.pow(t, 3);
      }

      function sampleCurveY(t) {
        return 3 * Math.pow(1 - t, 2) * t * p1.y + 3 * (1 - t) * Math.pow(t, 2) * p2.y + Math.pow(t, 3);
      }

      function solveCubicBezierY(x) {
        x = Math.max(0, Math.min(1, x));

        let t = x;
        for (let i = 0; i < 8; i++) {
          const currentX = sampleCurveX(t) - x;
          if (Math.abs(currentX) < 1e-5) break;

          const dX = 3 * Math.pow(1 - t, 2) * p1.x + 6 * (1 - t) * t * (p2.x - p1.x) + 3 * Math.pow(t, 2) * (1 - p2.x);
          if (Math.abs(dX) < 1e-6) break;

          t -= currentX / dX;
        }

        return sampleCurveY(t);
      }

      // --- Motion Animation Engine ---
      const cycleDuration = 3500; // 3.5s Ping Pong Cycle
      const animationStart = performance.now();

      function getTravelDistance() {
        const stage = circle.parentElement;
        const circleSize = circle.getBoundingClientRect().width;
        const left = 40;
        const right = Math.max(left, stage.getBoundingClientRect().width - left - circleSize);
        return Math.max(0, right - left);
      }

      function animate(now) {
        const elapsed = now - animationStart;
        const cycle = (elapsed % cycleDuration) / cycleDuration; // 0..1

        let progressLinear = 0;

        if (cycle <= 0.5) {
          progressLinear = cycle / 0.5;
        } else {
          progressLinear = 1 - ((cycle - 0.5) / 0.5);
        }

        const easedProgress = solveCubicBezierY(progressLinear);
        const travel = getTravelDistance();

        circle.style.transform = `translate3d(${easedProgress * travel}px, -50%, 0)`;

        // Continuous redraw for handle pulsing if user hasn't interacted
        drawCanvas();

        requestAnimationFrame(animate);
      }

      // --- Iframe Embedding Support ---
      // Reports the content height to the parent page so the surrounding
      // iframe can grow/shrink instead of showing its own scrollbar.
      let lastReportedHeight = 0;

      function reportHeight() {
        if (window.parent === window) return;

        // Must be the body box, not documentElement.scrollHeight: the latter
        // never falls below the iframe's own viewport, so once the host grows
        // the frame the height could only ever ratchet up, never shrink back.
        const height = Math.ceil(document.body.getBoundingClientRect().height);

        // Only report actual changes - prevents a resize feedback loop with
        // the parent and keeps the message channel quiet.
        if (height === lastReportedHeight) return;

        lastReportedHeight = height;
        window.parent.postMessage({ type: 'motionbase:resize', height }, '*');
      }

      window.addEventListener("resize", reportHeight);
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(reportHeight).observe(document.body);
      }

      // Initialize
      resizeCanvas();
      reportHeight();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
